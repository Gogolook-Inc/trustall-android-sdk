trustall-urlscan = { group = "com.gogolook.trustall", name = "trustall-urlscan" }

# Dependencies of the included build-logic
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
android-tools-common = { group = "com.android.tools", name = "common", version.ref = "androidTools" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
room-gradlePlugin = { group = "androidx.room", name = "room-gradle-plugin", version.ref = "room" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
secrets = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version.ref = "secrets" }

# Plugins defined by build-logic
trustall-android-library = { id = "trustall.android.library", version = "unspecified" }
trustall-android-library-jacoco = { id = "trustall.android.library.jacoco", version = "unspecified" }
trustall-android-library-compose = { id = "trustall.android.library.compose", version = "unspecified" }
trustall-android-lint = { id = "trustall.android.lint", version = "unspecified" }
trustall-android-room = { id = "trustall.android.room", version = "unspecified" }
trustall-android-test = { id = "trustall.android.test", version = "unspecified" }
trustall-maven-artifactory = { id = "trustall.maven.artifactory", version = "unspecified" }
