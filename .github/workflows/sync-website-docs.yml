name: Sync website docs

# Regenerates the Android pages of the developer website from docs/ and opens a pull request
# there. The site is built first, so a page that does not compile never reaches the website repo.
#
# The website repo is private, so the token comes from a GitHub App installed on
# Gogolook-Inc/trustall-website with Contents and Pull requests read/write. Its App ID and private
# key are the WEBSITE_SYNC_APP_ID and WEBSITE_SYNC_APP_PRIVATE_KEY repository secrets.

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'scripts/sync-website-docs.mjs'
      - '.github/workflows/sync-website-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-website-docs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mint a token for the website repo
        id: website-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.WEBSITE_SYNC_APP_ID }}
          private-key: ${{ secrets.WEBSITE_SYNC_APP_PRIVATE_KEY }}
          owner: Gogolook-Inc
          repositories: trustall-website

      - uses: actions/checkout@v4
        with:
          repository: Gogolook-Inc/trustall-website
          token: ${{ steps.website-token.outputs.token }}
          path: website

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/site/package-lock.json

      - name: Generate Android pages
        run: node scripts/sync-website-docs.mjs website

      - name: Build website
        working-directory: website/site
        run: |
          npm ci
          npm run build

      - name: Open pull request on the website
        uses: peter-evans/create-pull-request@v7
        with:
          path: website
          token: ${{ steps.website-token.outputs.token }}
          base: main
          branch: sync/android-docs
          delete-branch: true
          add-paths: site/docs/android
          commit-message: |
            Sync Android docs from trustall-android-sdk@${{ github.sha }}

            Generated by the sync-website-docs workflow from
            https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          title: 'Sync Android docs from trustall-android-sdk'
          body: |
            Android pages regenerated from `docs/` at [${{ github.repository }}@${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) by the [sync-website-docs workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            The site was built from these pages before this PR was opened. Review the diff and merge; `main` deploys automatically.
